<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dynamic title & theme setup based on domain -->
    <script>
      (function() {
        var host = (window.location.hostname || '').toLowerCase();
        var title = "CinemaOS — Watch Free Movies, Anime & TV Shows Online in HD | Official CinemaOS";
        var themeColor = "#e11d48";
        if (host.includes("plexmovies")) {
          title = "PlexMovies — Stream Free Movies & TV Shows Online in Full HD | Official PlexMovies";
          themeColor = "#E5A00D";
        } else if (host.includes("hexa")) {
          title = "Hexa Watch — Watch Free Movies & TV Shows Online in Full HD | Official Hexa Alternative";
          themeColor = "#4f46e5";
        } else if (host.includes("flixer")) {
          title = "Flixer — Stream Movies & TV Series Online Free in Full HD | Official Flixer";
          themeColor = "#ef4444";
        }
        document.title = title;
        
        var metaTheme = document.createElement('meta');
        metaTheme.setAttribute('name', 'theme-color');
        metaTheme.setAttribute('content', themeColor);
        document.head.appendChild(metaTheme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0FCNC8NBKH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0FCNC8NBKH');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
